name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: macos-latest
          - python: '3.13'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS) brew list ripgrep || brew install ripgrep ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[code,dev]'
      - run: sh scripts/check.sh
      - run: |
          python -m venv "$RUNNER_TEMP/jev-wheel"
          if [ "$RUNNER_OS" = Windows ]; then BIN="$RUNNER_TEMP/jev-wheel/Scripts"; else BIN="$RUNNER_TEMP/jev-wheel/bin"; fi
          "$BIN/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$BIN/jev-filter" --version
          "$BIN/jev-filter" doctor
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,browser-test]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser.py tests/test_dashboard_browser.py tests/test_act_browser.py tests/test_act_transports.py tests/test_cdp.py
        env:
          JEV_BROWSER_NO_SANDBOX: "1"
  desktop-windows:
    # Live UI Automation and OCR on a Windows runner; informational until proven stable there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,desktop]"
      - run: python -m pytest tests/test_act_desktop.py -rs
        env:
          JEV_DESKTOP_TESTS: "1"
  desktop-macos:
    # Needs Accessibility for the runner's Python; tests skip with a reason when it is absent.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,desktop]"
      - name: Try to grant Accessibility to the runner's Python (best effort)
        run: |
          PY="$(python -c 'import os,sys; print(os.path.realpath(sys.executable))')"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags) VALUES ('kTCCServiceAccessibility', '$PY', 1, 2, 4, 1, 'UNUSED', 0);" || true
      - run: python -m pytest tests/test_act_desktop.py -rs
        env:
          JEV_DESKTOP_TESTS: "1"
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
  ci:
    if: always()
    needs: [test, browser, npm]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.test.result }}' = success && test '${{ needs.browser.result }}' = success && test '${{ needs.npm.result }}' = success
