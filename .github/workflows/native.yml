name: Native packages
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[code,bundle]'
      - run: python scripts/build_native.py
      - run: python scripts/pack_npm.py
      - run: python scripts/smoke_npm.py
      - run: python scripts/check_packages.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}-*.tgz
          if-no-files-found: error
  native:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.build.result }}' = success
