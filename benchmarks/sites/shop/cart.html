<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cart</title><script src="common.js"></script>
<style>body{font:16px system-ui;margin:0;padding:16px 24px}</style></head><body>
<h1>Your cart</h1><ul id="items"></ul><p id="total"></p>
<button id="order">Place order</button> <a href="index.html">Continue shopping</a>
<script>
function render() {
  const items = cart();
  document.getElementById('items').innerHTML = items.map((it, i) => { const x = PRODUCTS.find(p => p.id === it.id);
    return `<li>${x.name} size ${it.size} — $${x.price} <button data-i="${i}" class="rm">Remove ${x.name}</button></li>`; }).join('') || '<li>Your cart is empty.</li>';
  document.getElementById('total').textContent = 'Total: $' + items.reduce((s, it) => s + PRODUCTS.find(p => p.id === it.id).price, 0);
  document.querySelectorAll('.rm').forEach(b => b.onclick = () => { const c = cart(); c.splice(+b.dataset.i, 1); saveCart(c); render(); });
}
document.getElementById('order').onclick = () => { if (!cart().length) return; saveCart([]); location.href = 'thanks.html'; };
render();
</script></body></html>
