<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Jev Filter — 把关键信号交给 AI</title>
<desc id="desc">采集一次，结合上下文判断，返回可回查的证据。程序采集记录，Jev 进行类型化语义判断，主模型接收选中证据和待复核 ID，原文保留在本地。2026-09-23 历史测试：48 次合成 agent 运行，返回工具上下文减少 88–97%。</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#080e1c"/><stop offset="1" stop-color="#14213b"/></linearGradient>
  <linearGradient id="signal" x2="1" y2="1"><stop stop-color="#77efc5"/><stop offset="1" stop-color="#95a2ff"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#1e3048"/><stop offset="1" stop-color="#132239"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8293bb" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#background)"/>
<rect width="1200" height="560" rx="24" fill="url(#grid)"/>
<circle cx="1080" cy="36" r="275" fill="#786cf5" opacity=".055"/>
<circle cx="590" cy="570" r="290" fill="#34d3a3" opacity=".045"/>
<g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="54" y="45" width="181" height="30" rx="15" fill="#15382f" stroke="#2e6759"/>
  <circle cx="73" cy="60" r="4" fill="#73edc4"/>
  <text x="86" y="65" fill="#9deace" font-size="12" font-weight="600" letter-spacing="1.1">THE DECISION LAYER</text>
  <text x="51" y="151" fill="#f2f6fd" font-size="68" font-weight="750" letter-spacing="-2.5">jev<tspan fill="#83ebc6">-filter</tspan></text>
  <text x="54" y="217" fill="#f3f7fd" font-size="39" font-weight="650">把关键信号</text>
  <text x="54" y="268" fill="url(#signal)" font-size="39" font-weight="650">交给 AI。</text>
  <text x="56" y="310" fill="#9badc8" font-size="18">采集一次，结合上下文判断。</text>
  <text x="56" y="337" fill="#9badc8" font-size="18">返回可回查的证据。</text>
  <g font-size="12" font-weight="600">
    <rect x="55" y="365" width="64" height="27" rx="7" fill="#1f2e45" stroke="#35465e"/><text x="76" y="383" fill="#c4d1e8">CLI</text>
    <rect x="127" y="365" width="85" height="27" rx="7" fill="#1f2e45" stroke="#35465e"/><text x="148" y="383" fill="#c4d1e8">Python</text>
    <rect x="220" y="365" width="90" height="27" rx="7" fill="#1f2e45" stroke="#35465e"/><text x="237" y="383" fill="#c4d1e8">JS / TS</text>
    <rect x="318" y="365" width="67" height="27" rx="7" fill="#1f2e45" stroke="#35465e"/><text x="337" y="383" fill="#c4d1e8">MCP</text>
    <rect x="393" y="365" width="112" height="27" rx="7" fill="#1f2e45" stroke="#35465e"/><text x="411" y="383" fill="#c4d1e8">Agent skills</text>
  </g>
  <rect x="589" y="64" width="548" height="75" rx="14" fill="#152237" stroke="#31425d"/>
  <circle cx="612" cy="90" r="4" fill="#7484a0"/>
  <text x="625" y="95" fill="#94a5bf" font-size="12" font-weight="600" letter-spacing="1.8">TOOL OUTPUT / 工具输出</text>
  <text x="611" y="120" fill="#c2cde0" font-size="15">a · DNS 已恢复。 b · DNS 仍失败。</text>
  <path d="M863 139V173" stroke="#53768e" stroke-width="2"/>
  <path d="m858 168 5 5 5-5" fill="none" stroke="#53768e" stroke-width="2"/>
  <rect x="718" y="180" width="290" height="64" rx="13" fill="#143d36" stroke="#4b9a7f"/>
  <text x="742" y="206" fill="#a5f0d5" font-size="12" font-weight="650" letter-spacing="1.2">JEV + 你提供的上下文</text>
  <text x="742" y="229" fill="#d2ede5" font-size="16">哪个故障当前仍未恢复？</text>
  <path d="M863 244V278" stroke="#6fc8ae" stroke-width="2"/>
  <path d="m858 273 5 5 5-5" fill="none" stroke="#6fc8ae" stroke-width="2"/>
  <rect x="626" y="285" width="474" height="121" rx="14" fill="url(#panel)" stroke="#566795"/>
  <rect x="648" y="301" width="108" height="22" rx="6" fill="#263a53"/>
  <text x="660" y="317" fill="#c4d2eb" font-size="11" font-weight="700" letter-spacing="1">EVIDENCE PACKET</text>
  <g font-family="ui-monospace,Consolas,monospace" font-size="15">
    <text x="649" y="345" fill="#b0c3e7">selected_ids: <tspan fill="#91eac5">["b"]</tspan></text>
    <text x="649" y="370" fill="#b0c3e7">review_ids:   <tspan fill="#cad8ec">[]</tspan></text>
  </g>
  <text x="649" y="394" fill="#839bbd" font-size="12">按来源 ID 回查原文 ↗ 保留判断收据 ↗</text>
  <line x1="54" y1="439" x2="1146" y2="439" stroke="#2e3e58"/>
  <path d="M410 458V528M805 458V528" stroke="#2e3e58"/>
  <text x="54" y="479" fill="#91edc9" font-size="36" font-weight="750" letter-spacing="-1">88–97%</text>
  <text x="54" y="506" fill="#d5e6f0" font-size="16" font-weight="600">返回工具上下文减少</text>
  <text x="54" y="530" fill="#a3b5cf" font-size="14">48 次合成 agent 运行 · 2026-09-23</text>
  <text x="443" y="480" fill="#e3e7ff" font-size="25" font-weight="650">判断有出处</text>
  <text x="443" y="506" fill="#c2cce2" font-size="14">按 ID 回查原文 · 保留判断收据</text>
  <text x="443" y="530" fill="#a3b5cf" font-size="14">未知与失败明确保留</text>
  <text x="840" y="480" fill="#e8eef8" font-size="25" font-weight="650">一套核心，四种接入</text>
  <text x="840" y="506" fill="#c2cce2" font-size="15">CLI · Python · JS / TS · MCP</text>
  <text x="840" y="530" fill="#a3b5cf" font-size="14">共享证据与判断核心</text>
</g></svg>
