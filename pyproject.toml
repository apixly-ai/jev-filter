[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "jev-filter"
version = "0.4.1"
description = "Typed decisions and traceable evidence for AI agents, powered by Jev"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "JIA-ss"}]
keywords = ["agents", "jev", "context", "cli", "semantic-search"]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Operating System :: MacOS", "Operating System :: Microsoft :: Windows", "Topic :: Software Development :: Libraries"]
dependencies = ["httpx>=0.28.1,<0.29"]

[project.optional-dependencies]
stats = ["tiktoken>=0.9,<1"]
code = ["tree-sitter>=0.25.2,<0.27", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23.2,<0.24", "tree-sitter-go>=0.25,<0.26"]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=7,<8", "pip-audit>=2.8,<3", "jsonschema>=4.23,<5", "pyyaml>=6,<7"]
docs = ["matplotlib>=3.10,<4", "markdown>=3.7,<4"]
bench-llm = ["system-one-adapter>=0.2.1,<0.3"]
bundle = ["pyinstaller>=6.16,<7", "tiktoken>=0.9,<1"]
browser-test = ["playwright>=1.51,<2"]
desktop = [
  "uiautomation>=2.0.20,<3; sys_platform == 'win32'",
  "winrt-runtime>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Media.Ocr>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3,<4; sys_platform == 'win32'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "mss>=9,<11",
]

[project.scripts]
jev-filter = "jev_context.cli:entrypoint"
jev-context = "jev_context.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/apixly-ai/jev-filter"
Documentation = "https://github.com/apixly-ai/jev-filter/tree/main/docs"
Issues = "https://github.com/apixly-ai/jev-filter/issues"
Changelog = "https://github.com/apixly-ai/jev-filter/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_context", "src/jev_filter"]
[tool.hatch.build.targets.sdist]
include = [".github/workflows", "src", "tests", "docs", "examples", "skills", "benchmarks", "schemas", "scripts", "npm", "package.json", "pyproject.toml", "*.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "browser: local browser tests, no external account",
  "desktop: local desktop automation tests (Windows UIA, macOS AX), no external account",
]

[tool.coverage.run]
source = ["jev_context"]
# Windows-only live backends; measured by the Windows desktop CI job (UI Automation + OCR).
omit = ["*/jev_context/act/desktop_windows.py", "*/jev_context/act/ocr.py"]
[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
